name: Auto Workflow Checker

on:
  push:
    branches: [ "main", "master", "dev", "develop" ]
  pull_request:
    branches: [ "main", "master", "dev", "develop" ]

jobs:
  check-workflows:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Run Actionlint Directly
        run: |
          bash <(curl -SFs https://githubusercontent.com)
          ./actionlint

